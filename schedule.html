<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7285">
<title>לו״ז מלא · אילת 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%8C%B4%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="trip-data.js"></script>
<style>
  :root {
    --bg: #f5f7f8; --surface: #FFFFFF; --surface-2: #e6ecee; --ink: #18323a; --ink-soft: #45585e; --muted: #6b7d83;
    --border: #e6ecee; --primary: #0b7285; --primary-dark: #085a68; --primary-soft: #e8f8fb;
    --accent: #f59f00; --accent-dark: #c07f22; --accent-soft: #fff4d6;
    --shadow: 0 5px 18px rgba(24,50,58,0.08); --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121b1e; --surface:#17262a; --surface-2:#1c2e32; --ink:#eaf4f5; --ink-soft:#b9cdd1; --muted:#8aa0a5;
      --border:#26383c; --primary:#4fb3c4; --primary-dark:#7fcbd8; --primary-soft:#1c3438;
      --accent:#f0b75b; --accent-dark:#f6cd8b; --accent-soft:#3a2f19; --shadow:0 4px 18px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="dark"] {
    --bg:#121b1e; --surface:#17262a; --surface-2:#1c2e32; --ink:#eaf4f5; --ink-soft:#b9cdd1; --muted:#8aa0a5;
    --border:#26383c; --primary:#4fb3c4; --primary-dark:#7fcbd8; --primary-soft:#1c3438;
    --accent:#f0b75b; --accent-dark:#f6cd8b; --accent-soft:#3a2f19; --shadow:0 4px 18px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { background: var(--bg); color: var(--ink); font-family:'Heebo',system-ui,-apple-system,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color: inherit; }
  .wrap { max-width: 720px; margin: auto; padding: 0 16px 40px; }

  header.app-header {
    position: sticky; top:0; z-index: 20; background: var(--bg);
    display:flex; align-items:center; justify-content:space-between;
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px; margin: 0 -16px;
    border-bottom: 1px solid var(--border);
  }
  header.app-header .brand { display:flex; align-items:center; gap:8px; }
  header.app-header .brand .emoji { font-size:20px; }
  header.app-header .brand h1 { font-size:16px; margin:0; font-weight:800; }
  .header-actions { display:flex; align-items:center; gap:8px; }
  .switcher { display:flex; gap:6px; background: var(--surface); border:1px solid var(--border); border-radius:999px; padding:3px; }
  .switch-btn { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; text-decoration:none; color: var(--ink-soft); }
  .switch-btn.active { background: var(--primary); color:#fff; }
  .icon-btn { width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background: var(--surface); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer; color: var(--ink-soft); }

  .backlink { display:inline-flex; align-items:center; gap:6px; color: var(--primary-dark); text-decoration:none; font-weight:700; font-size:14.5px; margin:18px 0 6px; }
  h2 { font-size:24px; margin:6px 0 16px; }

  .day { background: var(--surface); border:1px solid var(--border); border-radius: var(--radius); padding:18px; margin:12px 0; box-shadow: var(--shadow); }
  .dayhead { display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .day h3 { margin:0; font-size:19px; }
  .date { color: var(--muted); font-size:13px; }
  .meal { padding:14px 0; border-top:1px solid var(--border); }
  .meal:first-of-type { border-top:0; }
  .meal h4 { margin:0 0 8px; font-size:15.5px; }
  .meal ul { margin:0; padding-inline-start:20px; line-height:1.8; }
  .meal p { margin:0; color: var(--ink-soft); }
  footer { text-align:center; color: var(--muted); font-size:13px; padding:25px 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="app-header">
    <div class="brand"><span class="emoji">📅</span><h1>הלו״ז המלא</h1></div>
    <div class="header-actions">
      <div class="switcher">
        <a class="switch-btn" href="index.html" title="בית">🏠</a>
        <a class="switch-btn" href="shopping.html" title="קניות">🛒</a>
        <a class="switch-btn" href="expenses.html" title="הוצאות">💰</a>
      </div>
      <button class="icon-btn" data-action="toggle-theme" title="ערכת נושא">🌓</button>
    </div>
  </header>

  <a class="backlink" href="index.html">→ חזרה לעמוד הבית</a>
  <h2>📅 הלו״ז המלא</h2>
  <div id="scheduleContainer"></div>

  <footer>אילת 2026 · גרסה ראשונה 🌴</footer>
</div>

<script>
(function(){
  "use strict";
  var LS_THEME = 'eilat2026_theme_v1';
  function initTheme(){
    var saved = localStorage.getItem(LS_THEME);
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  }
  function toggleTheme(){
    var cur = document.documentElement.getAttribute('data-theme');
    var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next;
    if (!cur) next = sysDark ? 'light' : 'dark';
    else if (cur === 'dark') next = 'light';
    else next = 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(LS_THEME, next);
  }
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action="toggle-theme"]');
    if (el) toggleTheme();
  });

  function esc(s){
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function renderAll(){
    var todayKey = tripDateKey(new Date());
    var html = '';
    TRIP_DAYS.forEach(function(day){
      var isToday = day.date === todayKey;
      html += '<div class="day"' + (isToday ? ' style="border-color:var(--primary);"' : '') + '>' +
        '<div class="dayhead"><h3>' + esc(day.label) + (isToday ? ' 📍' : '') + '</h3>' +
        (day.note ? '<span class="date">' + esc(day.note) + '</span>' : '') + '</div>';
      day.events.forEach(function(ev){
        html += '<div class="meal"><h4>' + esc(ev.time) + ' ' + esc(ev.title) + '</h4>';
        if (ev.items && ev.items.length) html += '<ul>' + ev.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
        else if (ev.note) html += '<p class="date">' + esc(ev.note) + '</p>';
        html += '</div>';
      });
      html += '</div>';
    });
    document.getElementById('scheduleContainer').innerHTML = html;
  }

  initTheme();
  renderAll();
})();
</script>
</body>
</html>
